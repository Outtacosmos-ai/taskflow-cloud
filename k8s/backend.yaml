apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow-backend
  template:
    metadata:
      labels:
        app: taskflow-backend
    spec:
      containers:
      - name: backend
        image: 362324939829.dkr.ecr.us-east-1.amazonaws.com/taskflow-backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/taskflow"
        - name: SQS_QUEUE_URL
          value: "https://sqs.us-east-1.amazonaws.com/362324939829/taskflow-notifications-dev"
        - name: AWS_REGION
          value: "us-east-1"
        - name: JWT_SECRET
          value: "taskflow_super_secret_key_123"
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-backend
spec:
  type: LoadBalancer
  selector:
    app: taskflow-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
