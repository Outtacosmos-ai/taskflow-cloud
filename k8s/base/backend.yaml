apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskflow-sa
  namespace: taskflow
  annotations:
    # This maps the K8s identity to the AWS IAM Role
    eks.amazonaws.com/role-arn: arn:aws:iam::657577038059:role/taskflow-pod-role-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend
  namespace: taskflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: taskflow-backend
  template:
    metadata:
      labels:
        app: taskflow-backend
    spec:
      serviceAccountName: taskflow-sa # Critical for SQS/CloudWatch access
      containers:
      - name: backend
        image: 657577038059.dkr.ecr.us-east-1.amazonaws.com/taskflow-backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: MONGODB_URI
          # Update this with your EC2 Private IP
          value: "mongodb://<MONGODB_PRIVATE_IP>:27017/taskflow" 
        - name: SQS_QUEUE_URL
          value: "https://sqs.us-east-1.amazonaws.com/657577038059/taskflow-notifications-dev"
        - name: AWS_REGION
          value: "us-east-1"
        - name: JWT_SECRET
          value: "taskflow_super_secret_key_123"
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-backend
  namespace: taskflow
spec:
  type: LoadBalancer
  selector:
    app: taskflow-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000