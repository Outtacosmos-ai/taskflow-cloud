apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskflow-sa
  namespace: taskflow
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::657577038059:role/taskflow-pod-role-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend
  namespace: taskflow
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: taskflow-backend
  template:
    metadata:
      labels:
        app: taskflow-backend
    spec:
      serviceAccountName: taskflow-sa
      containers:
      - name: backend
        image: BACKEND_IMAGE
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        env:
        - name: NODE_ENV
          value: "production"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/taskflow"
        - name: SQS_QUEUE_URL
          value: "https://sqs.us-east-1.amazonaws.com/657577038059/taskflow-notifications-dev"
        - name: AWS_REGION
          value: "us-east-1"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: taskflow-secrets
              key: jwt-secret