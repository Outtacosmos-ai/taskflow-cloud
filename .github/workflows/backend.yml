name: Deploy Backend
on:
  push:
    paths: ['backend/**']
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - name: Build and Push
        run: |
          cd backend
          docker build -t ${{ steps.login-ecr.outputs.registry }}/taskflow-backend:latest .
          docker push ${{ steps.login-ecr.outputs.registry }}/taskflow-backend:latest
      - name: Deploy
        run: |
          aws eks update-kubeconfig --name taskflow-dev --region us-east-1
          kubectl rollout restart deployment taskflow-backend