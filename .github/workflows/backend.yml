name: Deploy Backend

on:
  push:
    paths: ['backend/**']
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push to ECR
        run: |
          cd backend
          docker build -t ${{ steps.login-ecr.outputs.registry }}/taskflow-backend:${{ github.sha }} .
          docker push ${{ steps.login-ecr.outputs.registry }}/taskflow-backend:${{ github.sha }}

      - name: Deploy to EKS
        env:
          KUBECONFIG: /home/runner/.kube/config
        run: |
          aws eks update-kubeconfig --name taskflow-dev --region us-east-1
          kubectl config use-context arn:aws:eks:us-east-1:657577038059:cluster/taskflow-dev
          
          # This updates the backend deployment to the new image
          kubectl set image deployment/taskflow-backend backend=${{ steps.login-ecr.outputs.registry }}/taskflow-backend:${{ github.sha }} -n taskflow
          kubectl rollout status deployment/taskflow-backend -n taskflow