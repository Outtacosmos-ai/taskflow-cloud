name: Deploy Backend
on:
  push:
    paths: ['backend/**']
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
        
      - name: Build and Push
        run: |
          cd backend
          # Using Commit SHA as tag to prevent caching issues
          docker build -t ${{ steps.login-ecr.outputs.registry }}/taskflow-backend:${{ github.sha }} .
          docker push ${{ steps.login-ecr.outputs.registry }}/taskflow-backend:${{ github.sha }}
          
      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name taskflow-dev --region us-east-1
          # Force the deployment to use the new versioned image
          kubectl set image deployment/taskflow-backend backend=${{ steps.login-ecr.outputs.registry }}/taskflow-backend:${{ github.sha }} -n taskflow