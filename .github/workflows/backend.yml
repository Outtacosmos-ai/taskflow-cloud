name: Deploy Backend
on:
  push:
    paths: ['backend/**']
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and Push
        run: |
          docker build -t 362324939829.dkr.ecr.us-east-1.amazonaws.com/taskflow-backend:latest ./backend
          docker push 362324939829.dkr.ecr.us-east-1.amazonaws.com/taskflow-backend:latest
      - name: Deploy
        run: |
          aws eks update-kubeconfig --name taskflow-cluster --region us-east-1
          kubectl rollout restart deployment taskflow-backend