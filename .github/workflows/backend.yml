name: Deploy Backend
on:
  push:
    paths:
      - 'backend/**'
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Build and Push
        run: |
          docker build -t ${{ secrets.ECR_REGISTRY }}/taskflow-backend:latest ./backend
          docker push ${{ secrets.ECR_REGISTRY }}/taskflow-backend:latest
      - name: Deploy
        run: |
          aws eks update-kubeconfig --name taskflow-dev --region us-east-1
          kubectl rollout restart deployment taskflow-backend
