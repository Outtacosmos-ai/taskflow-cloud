name: Deploy Backend
on:
  push:
    paths:
      - 'backend/**'
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push
        run: |
          # Use the dynamic registry output to avoid secret configuration errors
          docker build -t ${{ steps.login-ecr.outputs.registry }}/taskflow-backend:latest ./backend
          docker push ${{ steps.login-ecr.outputs.registry }}/taskflow-backend:latest

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name taskflow-dev --region us-east-1
          kubectl rollout restart deployment taskflow-backend