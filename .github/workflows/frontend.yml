name: Deploy Frontend
on:
  push:
    paths:
      - 'frontend/**'
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push
        run: |
          # 1. Create the .env inside the build context
          echo "VITE_API_URL=http://a17c1f2f83aa44189872346ebb2bb4f6-817499296.us-east-1.elb.amazonaws.com" > frontend/.env
          
          # 2. Build and Push using the dynamic registry URL
          docker build -t ${{ steps.login-ecr.outputs.registry }}/taskflow-frontend:latest ./frontend
          docker push ${{ steps.login-ecr.outputs.registry }}/taskflow-frontend:latest

      - name: Deploy to EKS
        run: |
          # SENIOR FIX: Ensure the cluster name matches your Terraform/AWS name
          aws eks update-kubeconfig --name taskflow-cluster --region us-east-1
          kubectl rollout restart deployment taskflow-frontend