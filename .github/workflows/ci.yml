name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # PFE REQUIREMENT: Linting and Testing
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend, worker]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: |
          cd ${{ matrix.service }}
          npm ci 
          
      - name: Run Lint
        run: |
          cd ${{ matrix.service }}
          npm run lint --if-present
          
      - name: Run Tests
        run: |
          cd ${{ matrix.service }}
          npm test --if-present

  # PFE REQUIREMENT: Build and Security Scan
  build-and-scan:
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        service: [frontend, backend, worker]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          cd ${{ matrix.service }}
          docker build -t ${{ steps.login-ecr.outputs.registry }}/taskflow-${{ matrix.service }}:${{ github.sha }} .

      # PFE REQUIREMENT: Trivy Security Scanning
      # FIXED: Changed exit-code to '1' to ensure the pipeline stops on CRITICAL vulnerabilities.
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/taskflow-${{ matrix.service }}:${{ github.sha }}
          format: 'table'
          exit-code: '1' 
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # Only pushes if the Trivy scan above returns an exit code of 0 (no criticals).
      - name: Push to ECR (If Scan Passes & on Main)
        if: github.ref == 'refs/heads/main' && success()
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/taskflow-${{ matrix.service }}:${{ github.sha }}
          docker tag ${{ steps.login-ecr.outputs.registry }}/taskflow-${{ matrix.service }}:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/taskflow-${{ matrix.service }}:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/taskflow-${{ matrix.service }}:latest